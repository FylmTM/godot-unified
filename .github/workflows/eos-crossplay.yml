# Internet crossplay check through EOS (src/eos/SPEC.md, "Crossplay"): a Windows runner joins a lobby that a
# developer's Mac hosts, plays the scripted session and reports its verified checksums. Manual only:
#
#   godot --headless --path games/survivor -- --host-online --scripted --ticks 23040 --quit-at-end
#   (or: survivor eos-host --ticks 2880 --wait-s 900 --bucket survivor/3 --code-file code.txt)
#   gh workflow run eos-crossplay.yml -f code=ABC234 -f client=source    (or client=export)
#
# client=source builds the survivor headless binary on the runner (EOS IDs from the repo secrets, read at
# run time). client=export runs the Windows zip of a release workflow run (its own compiled-in IDs and the
# SDK DLL its .gdextension shipped; no EOS secrets in its environment). Windows only, never macOS.
#
# Inputs are validated first (step p) and reach scripts only through env, never pasted into a script; the EOS
# secrets are in the one step that runs the source client; the job token can only read (the EOS SDK comes from
# eos-sdk.yml, the release run's artifact needs `actions: read`).
name: eos-crossplay

on:
  workflow_dispatch:
    inputs:
      code:
        description: Lobby code the Mac host printed
        required: true
      ticks:
        description: Session length in ticks; must equal the host's --ticks (15360 = 4 min at 64 Hz)
        default: "15360"
      client:
        description: source (headless binary built here) or export (Windows zip of a release run)
        default: source
      release_run:
        description: client=export only, the release workflow run id (empty = latest successful one)
        default: ""
      relays:
        description: allow or force (client=source only; the export uses the game's default, allow)
        default: allow
      bucket:
        description: client=source only, lobby bucket (survivor/3 = the game's; unified-headless/3 = eos-host's)
        default: survivor/3

permissions:
  contents: read

env:
  ODIN_TAG: dev-2026-11
  PYTHONUNBUFFERED: "1"

jobs:
  eos-sdk:
    uses: ./.github/workflows/eos-sdk.yml
    permissions:
      contents: write # only the fetch job in eos-sdk.yml, which runs no repository code

  join:
    name: join ${{ inputs.code }} (${{ inputs.client }})
    needs: eos-sdk
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # download the release run's artifact
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: p
        name: Parameters
        env:
          IN_CODE: ${{ inputs.code }}
          IN_TICKS: ${{ inputs.ticks }}
          IN_CLIENT: ${{ inputs.client }}
          IN_RUN: ${{ inputs.release_run }}
          IN_RELAYS: ${{ inputs.relays }}
          IN_BUCKET: ${{ inputs.bucket }}
        run: |
          # Also the place to read a request file from, for a temporary push trigger on a branch (GitHub
          # dispatches only workflows that are on the default branch). Every value is validated before it is
          # written to $GITHUB_ENV / $GITHUB_OUTPUT (a newline in an input could otherwise set any variable).
          CODE="$IN_CODE"; TICKS="${IN_TICKS:-15360}"; CLIENT="${IN_CLIENT:-source}"; RELEASE_RUN="$IN_RUN"
          RELAYS="${IN_RELAYS:-allow}"; BUCKET="${IN_BUCKET:-survivor/3}"
          bad() { echo "::error::invalid input $1"; exit 1; }
          [[ "$CODE" =~ ^[A-Z0-9]{6}$ ]] || bad "code (6 characters A-Z 0-9)"
          [[ "$TICKS" =~ ^[0-9]{1,7}$ ]] || bad "ticks (a number)"
          [[ "$CLIENT" =~ ^(source|export)$ ]] || bad "client (source or export)"
          [[ "$RELEASE_RUN" =~ ^[0-9]{0,20}$ ]] || bad "release_run (a run id or empty)"
          [[ "$RELAYS" =~ ^(allow|force)$ ]] || bad "relays (allow or force)"
          [[ "$BUCKET" =~ ^[a-z0-9_-]{1,32}/[0-9]{1,6}$ ]] || bad "bucket (name/number)"
          {
            echo "CODE=$CODE"
            echo "TICKS=$TICKS"
            echo "CLIENT=$CLIENT"
            echo "RELEASE_RUN=$RELEASE_RUN"
            echo "RELAYS=$RELAYS"
            echo "BUCKET=$BUCKET"
          } >> "$GITHUB_ENV"
          echo "client=$CLIENT" >> "$GITHUB_OUTPUT"
          echo "code $CODE, ticks $TICKS, client $CLIENT, relays $RELAYS, bucket $BUCKET"

      # --- client=source: the headless binary, built here --------------------------------------------------
      - if: steps.p.outputs.client == 'source'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .toolchains/odin
          key: odin-${{ env.ODIN_TAG }}-windows-x64
      - if: steps.p.outputs.client == 'source'
        name: Odin
        run: python tools/ci.py odin ${{ env.ODIN_TAG }} .toolchains/odin
      - if: steps.p.outputs.client == 'source'
        id: cc
        run: echo "id=$(python tools/ci.py compiler-id)" >> "$GITHUB_OUTPUT"
      - if: steps.p.outputs.client == 'source'
        id: box3d-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/box3d/build/windows-x64
          key: box3d-windows-x64-${{ steps.cc.outputs.id }}-${{ hashFiles('third_party/box3d.patch', 'tools/box3d.py', 'tools/common.py') }}
      - if: steps.p.outputs.client == 'source'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/eos
          key: ${{ needs.eos-sdk.outputs.cache-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - if: steps.p.outputs.client == 'source' && steps.box3d-cache.outputs.cache-hit != 'true'
        run: python tools/ci.py ensure-ninja
      - if: steps.p.outputs.client == 'source'
        name: Build survivor (release) + EOS SDK
        run: |
          python tools/box3d.py
          python tools/eos.py
          python tools/dev.py build release
      - if: steps.p.outputs.client == 'source'
        name: eos-client
        env:
          EOS_PRODUCT_ID: ${{ secrets.EOS_PRODUCT_ID }}
          EOS_SANDBOX_ID: ${{ secrets.EOS_SANDBOX_ID }}
          EOS_DEPLOYMENT_ID: ${{ secrets.EOS_DEPLOYMENT_ID }}
          EOS_CLIENT_ID: ${{ secrets.EOS_CLIENT_ID }}
          EOS_CLIENT_SECRET: ${{ secrets.EOS_CLIENT_SECRET }}
        run: |
          mkdir -p out/crossplay
          set +e
          out/release/survivor.exe eos-client --code "$CODE" --ticks "$TICKS" --relays "$RELAYS" --bucket "$BUCKET" \
            > out/crossplay/client.json 2> out/crossplay/client.log
          rc=$?
          set -e
          tail -n 30 out/crossplay/client.log
          tail -c 400 out/crossplay/client.json; echo
          exit $rc

      # --- client=export: the Windows zip of a release run ------------------------------------------------
      - if: steps.p.outputs.client == 'export'
        name: Download the Windows export
        run: |
          run="$RELEASE_RUN"
          if [ -z "$run" ]; then
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "release run $run" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n windows-x64 -D dist
          mkdir -p game && unzip -q dist/*.zip -d game
          find game -maxdepth 3 -type f | head -20
      - if: steps.p.outputs.client == 'export'
        name: Run the export headless (--join-code, scripted)
        run: |
          mkdir -p out/crossplay
          exe=$(find game -maxdepth 3 -name '*.console.exe' | head -1)
          [ -n "$exe" ] || exe=$(find game -maxdepth 3 -name '*.exe' | head -1)
          echo "exe: $exe"
          ls "$(dirname "$exe")"
          set +e
          timeout 1200 "$exe" --headless --log-file "$PWD/out/crossplay/godot.log" -- \
            --join-code "$CODE" --scripted --ticks "$TICKS" --quit-at-end > out/crossplay/stdout.log 2>&1
          rc=$?
          set -e
          tail -n 40 out/crossplay/stdout.log
          grep -h "unified: result" out/crossplay/stdout.log out/crossplay/godot.log | head -1 | sed 's/^unified: result //' > out/crossplay/client.json || true
          tail -c 400 out/crossplay/client.json; echo
          [ -s out/crossplay/client.json ] || exit 1
          exit $rc

      - if: always()
        name: Summary
        run: |
          {
            echo "### crossplay $CLIENT, code \`$CODE\`, $TICKS ticks"
            echo '```'
            grep -o '"ok":[a-z]*\|"network":"[A-Za-z]*"\|"rtt_ms":[0-9.]*\|"rollbacks":[0-9]*\|"final_tick":[0-9]*\|"join_tick":[0-9]*\|"delay":[0-9]*' out/crossplay/client.json 2>/dev/null | tr '\n' ' '
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crossplay-${{ steps.p.outputs.client }}-${{ env.CODE }}
          path: out/crossplay/
          if-no-files-found: ignore
          retention-days: 14
