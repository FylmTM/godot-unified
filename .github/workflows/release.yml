# A release of the library (the `release` skill, .claude/skills/release/): one version, one tag on main,
# `v<major>.<minor>.<patch>` or `v<major>.<minor>.<patch>-rc.<n>`. The tag runs the full check, all or nothing:
#   check    everything CI runs (ci.yml, called: fmt and vet, the four test platforms with macOS, the godot job)
#   games    every game with an export_presets.cfg exported and smoke-tested on windows-x64 and macos-arm64, one job
#            per platform building the games in turn (`uni release --tag`, with and without the dev UI; no EOS: CI
#            has no SDK and no credentials). The zips are thrown away: no game builds are published, the exports
#            only prove the pipeline works.
#   publish  only when both pass: a GitHub release titled `unified v<version>` (a prerelease while the major version
#            is 0, and for a release candidate) with generated notes (the PRs merged since the last tag) and GitHub's
#            source archives. No binaries. Game repos pin the unified submodule to the tag.
# Manual runs (workflow_dispatch) check the pipeline on any branch without publishing: windows-x64 only unless
# `macos` (its runners are often out of capacity), the games stamped dev-<commit>.
# Every job but publish reads only and holds no secrets; publish writes the release. Actions, runner images and
# downloads are pinned, and Odin comes through the uni shim (see ci.yml).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos:
        description: "Also check macos-arm64 (CI's macOS job and the macOS exports)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    name: the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      prerelease: ${{ steps.m.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag must be on main
      - id: m
        env:
          MACOS: ${{ inputs.macos }}
        run: |
          win='{"os":"windows-2025","platform":"windows-x64","uni":"./uni.cmd"}'
          mac='{"os":"macos-15","platform":"macos-arm64","uni":"./uni"}'
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # the rule `uni release --tag` checks too (tools/release.odin, release_version)
            n='(0|[1-9][0-9]*)'
            if ! [[ "$GITHUB_REF_NAME" =~ ^v$n\.$n\.$n(-rc\.$n)?$ ]]; then
              echo "::error::$GITHUB_REF_NAME is not a release tag: v<major>.<minor>.<patch>, optionally -rc.<n>"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME is not on main"
              exit 1
            fi
            prerelease=false
            if [ "${BASH_REMATCH[1]}" = 0 ] || [ -n "${BASH_REMATCH[4]}" ]; then prerelease=true; fi
            echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[$win,$mac]}" >> "$GITHUB_OUTPUT"
          elif [ "$MACOS" = true ]; then
            echo "matrix={\"include\":[$win,$mac]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$win]}" >> "$GITHUB_OUTPUT"
          fi

  # Everything CI runs on a push to main (a tag push is a push: all four platforms), the same workflow.
  check:
    name: check
    needs: meta
    uses: ./.github/workflows/ci.yml
    with:
      macos: ${{ inputs.macos == true }}
    permissions:
      contents: read
      actions: read # ci.yml's nightly job (skipped here) asks for it

  games:
    name: games / ${{ matrix.platform }}
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The shims' Odin and the Godot editor (the per-user cache: ~/.cache/unified on macOS, %LOCALAPPDATA%\unified on
      # Windows), keyed by pins.cfg; the export templates are fetched into Godot's own folder per run, checked against
      # pins.cfg (range reads: ~120 MB).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/unified/odin
            ~/.cache/unified/godot
            ~/AppData/Local/unified/odin
            ~/AppData/Local/unified/godot
          key: release-${{ matrix.platform }}-${{ hashFiles('pins.cfg') }}
      # Extension, version stamp, import, export, sign, zip, smoke test, for every game; no EOS (single player and
      # LAN). Playtest builds keep the dev UI (F3 notes); a public build drops it: both are checked.
      - name: uni release --no-eos (every game)
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=(--tag "$GITHUB_REF_NAME"); else tag=(); fi
          ${{ matrix.uni }} release --no-eos "${tag[@]}"
      - name: uni release --no-eos --no-devui (every game)
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=(--tag "$GITHUB_REF_NAME"); else tag=(); fi
          ${{ matrix.uni }} release --no-eos --no-devui "${tag[@]}"

  publish:
    name: publish
    if: github.ref_type == 'tag'
    needs: [meta, check, games]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes --title "unified $TAG")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" "${flags[@]}"
