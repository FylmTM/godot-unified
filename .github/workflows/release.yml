# Playable game builds (docs/RELEASE.md). A tag `<game>-v<version>` (e.g. survivor-v0.1.0) builds games/<game> for
# windows-x64 and macos-arm64 with tools/release.py, smoke-tests each export on its runner, and publishes a GitHub
# prerelease with both zips and SHA256SUMS.txt. Manual runs (workflow_dispatch) validate the pipeline: Windows
# only (macOS runners are for tag builds), any game folder, no release. The tag is the only source of the
# version: release.py stamps it into the export and fails if the export doesn't carry it.
# The build jobs have `contents: read` (the EOS SDK comes from eos-sdk.yml as a cache entry) and the EOS secrets
# only in the one step that compiles them in; actions, runner images and downloads are pinned (see ci.yml).
name: release

on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:
    inputs:
      game_dir:
        description: Game folder (a Godot project with export_presets.cfg)
        default: games/survivor

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ODIN_TAG: dev-2026-11
  GODOT_VERSION: 4.7.2
  PYTHONUNBUFFERED: "1"

jobs:
  meta:
    name: what to build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      game_dir: ${{ steps.m.outputs.game_dir }}
      version: ${{ steps.m.outputs.version }}
      matrix: ${{ steps.m.outputs.matrix }}
      stem: ${{ steps.m.outputs.stem }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: m
        env:
          INPUT_GAME_DIR: ${{ inputs.game_dir }}
        run: |
          win='{"os":"windows-2025","platform":"windows-x64","py":"python","templates":"~/AppData/Roaming/Godot/export_templates"}'
          mac='{"os":"macos-15","platform":"macos-arm64","py":"python3","templates":"~/Library/Application Support/Godot/export_templates"}'
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            game_dir="games/${tag%-v*}"
            version="${tag##*-v}"
            matrix="{\"include\":[$win,$mac]}"
          else
            game_dir="${INPUT_GAME_DIR:-games/survivor}"
            version="dev-${GITHUB_SHA::7}"
            matrix="{\"include\":[$win]}"
          fi
          if ! [[ "$game_dir" =~ ^games/[a-z0-9_-]+$ && "$version" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::bad game folder or version: $game_dir $version"
            exit 1
          fi
          if [ ! -f "$game_dir/project.godot" ] || [ ! -f "$game_dir/export_presets.cfg" ]; then
            echo "::error::$game_dir is not a game folder (needs project.godot and export_presets.cfg)"
            exit 1
          fi
          echo "game_dir=$game_dir" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # <game>-v<version> (dev builds: <game>-dev-<sha>), as release.py names the zips.
          label="$version"; [[ "$version" =~ ^[0-9] ]] && label="v$version"
          echo "stem=$(basename "$game_dir")-$label" >> "$GITHUB_OUTPUT"
          echo "Building \`$game_dir\` version \`$version\`" >> "$GITHUB_STEP_SUMMARY"

  eos-sdk:
    uses: ./.github/workflows/eos-sdk.yml
    permissions:
      contents: write # only the fetch job in eos-sdk.yml, which runs no repository code

  build:
    name: build / ${{ matrix.platform }}
    needs: [meta, eos-sdk]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      GAME_DIR: ${{ needs.meta.outputs.game_dir }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # A pip that can install ninja on every runner (macOS's system Python refuses, PEP 668).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .toolchains/odin
          key: odin-${{ env.ODIN_TAG }}-${{ matrix.platform }}
      # `ci.py odin` adds Odin to $GITHUB_PATH, which takes effect from the next step on.
      - name: Odin
        run: ${{ matrix.py }} tools/ci.py odin ${{ env.ODIN_TAG }} .toolchains/odin

      - id: cc
        run: echo "id=$(${{ matrix.py }} tools/ci.py compiler-id)" >> "$GITHUB_OUTPUT"
      - id: box3d-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/box3d/build/${{ matrix.platform }}
          key: box3d-${{ matrix.platform }}-${{ steps.cc.outputs.id }}-${{ hashFiles('third_party/box3d.patch', 'tools/box3d.py', 'tools/common.py') }}
      - if: steps.box3d-cache.outputs.cache-hit != 'true'
        run: ${{ matrix.py }} tools/ci.py ensure-ninja

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/eos
          key: ${{ needs.eos-sdk.outputs.cache-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # The Godot editor (.toolchains/godot) and this platform's export templates (Godot's standard folder); both
      # are checked against the SHA-256s pinned in tools/common.py and tools/release.py when downloaded.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .toolchains/godot
            ${{ matrix.templates }}/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-${{ matrix.platform }}-${{ hashFiles('tools/common.py', 'tools/release.py') }}

      # Dependencies, extension, version stamp, import, export, sign, zip, smoke test: tools/release.py. The only
      # step with the EOS secrets (compiled into the extension; release.py never prints them).
      - name: release.py build
        env:
          EOS_PRODUCT_ID: ${{ secrets.EOS_PRODUCT_ID }}
          EOS_SANDBOX_ID: ${{ secrets.EOS_SANDBOX_ID }}
          EOS_DEPLOYMENT_ID: ${{ secrets.EOS_DEPLOYMENT_ID }}
          EOS_CLIENT_ID: ${{ secrets.EOS_CLIENT_ID }}
          EOS_CLIENT_SECRET: ${{ secrets.EOS_CLIENT_SECRET }}
        run: |
          odin version
          require=""
          # A game whose extension imports unified:eos (dev.py's rule) must have the EOS IDs compiled in.
          if grep -qs '"unified:eos"' "$GAME_DIR"/simulation/extension/*.odin; then
            require="--embed-env EOS_PRODUCT_ID,EOS_SANDBOX_ID,EOS_DEPLOYMENT_ID,EOS_CLIENT_ID,EOS_CLIENT_SECRET"
          fi
          ${{ matrix.py }} tools/release.py build "$GAME_DIR" --version "$VERSION" $require

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.meta.outputs.stem }}-${{ matrix.platform }}
          path: |
            ${{ needs.meta.outputs.game_dir }}/.out/release/*.zip
            ${{ needs.meta.outputs.game_dir }}/.out/release/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: prerelease
    if: github.ref_type == 'tag'
    needs: [meta, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GAME_DIR: ${{ needs.meta.outputs.game_dir }}
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: gh release create
        run: |
          cd dist
          cat *.sha256 | tr -d '\r' > SHA256SUMS.txt   # LF only: macOS `shasum -c` rejects CRLF lines
          sha256sum -c SHA256SUMS.txt
          cd ..
          python3 tools/release.py notes "$GAME_DIR" --tag "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title "$(basename "$GAME_DIR") $VERSION" --notes-file notes.md \
            dist/*.zip dist/SHA256SUMS.txt
