# Playable game builds (the `release` skill, .claude/skills/release/). A tag `<game>-v<version>` (e.g.
# survivor-v0.1.0) builds that game for windows-x64 and macos-arm64 with `uni release --tag`, which takes the game
# and the version from the tag, stamps the version into the export (and fails if the export doesn't carry it),
# builds it without EOS (`--no-eos`: CI has no EOS SDK and no EOS credentials, so these packages play single
# player and LAN only; online-capable builds are made with `uni release` on a developer's machine), and smoke-tests
# the export on its runner; then a
# GitHub prerelease gets both zips and SHA256SUMS.txt. Manual runs (workflow_dispatch) validate the pipeline:
# Windows only (macOS runners are for tag builds), any game, no release.
# The build jobs have `contents: read` and no secrets; only the publish job writes (the prerelease). Actions, runner
# images and downloads are pinned (see ci.yml).
name: release

on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:
    inputs:
      game:
        description: Game (a directory under games/ with export_presets.cfg)
        default: survivor

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    name: what to build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          win='{"os":"windows-2025","platform":"windows-x64","uni":"./uni.cmd"}'
          mac='{"os":"macos-15","platform":"macos-arm64","uni":"./uni"}'
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "matrix={\"include\":[$win,$mac]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$win]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build / ${{ matrix.platform }}
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/odin
      # The Godot editor (.out/godot); the export templates are fetched into Godot's own folder per run, checked
      # against pins.cfg (range reads: ~120 MB).
      - id: keys
        run: echo "godot=$(${{ matrix.uni }} ci cache-key godot)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .out/godot
          key: ${{ steps.keys.outputs.godot }}
      # Extension, version stamp, import, export, sign, zip, smoke test; no EOS (single player and LAN).
      - name: uni release
        env:
          GAME: ${{ inputs.game }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ${{ matrix.uni }} release --no-eos --tag "$GITHUB_REF_NAME"
          else
            [[ "$GAME" =~ ^[a-z0-9_]+$ ]] || { echo "::error::bad game name: $GAME"; exit 1; }
            ${{ matrix.uni }} release --no-eos "$GAME"
          fi
      # One artifact per platform; the publish job downloads them all.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            games/*/.out/release/*.zip
            games/*/.out/release/*.sha256
          if-no-files-found: error
          include-hidden-files: true # .out/ is hidden, and a wildcard path skips hidden directories without this
          retention-days: 14

  publish:
    name: prerelease
    if: github.ref_type == 'tag'
    needs: [meta, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/odin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: gh release create
        run: |
          cd dist
          cat *.sha256 | tr -d '\r' > SHA256SUMS.txt   # LF only: macOS `shasum -c` rejects CRLF lines
          sha256sum -c SHA256SUMS.txt
          cd ..
          ./uni release notes --no-eos --tag "$GITHUB_REF_NAME" > notes.md
          tag="$GITHUB_REF_NAME"
          gh release create "$tag" --verify-tag --prerelease --title "${tag%-v*} ${tag##*-v}" --notes-file notes.md \
            dist/*.zip dist/SHA256SUMS.txt
