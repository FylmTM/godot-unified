# The EOS SDK (tools/eos.py) for the other workflows, as a cross-OS cache entry. The SDK is an asset of a draft
# release, and GitHub lists drafts only to tokens that can write to the repo. So this one small job holds
# `contents: write` and runs no repository code: it reads the pinned version and SHA-256 out of tools/eos.py,
# downloads the zip with gh, checks the hash and caches the unpacked SDK. Jobs that build or test (pull-request
# code) restore that cache with `contents: read` and never see a write token.
name: eos-sdk

on:
  workflow_call:
    outputs:
      cache-key:
        description: actions/cache key of third_party/eos (restore with enableCrossOsArchive)
        value: ${{ jobs.fetch.outputs.key }}

permissions:
  contents: read

jobs:
  fetch:
    name: EOS SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # read the draft release (see above); no repository code runs in this job
    outputs:
      key: ${{ steps.v.outputs.key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: tools/eos.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: v
        name: Pinned version and hash (read, not run)
        run: |
          version=$(sed -n 's/^VERSION = "\([0-9.]*\)"$/\1/p' tools/eos.py)
          sha=$(sed -n 's/^ASSET_SHA256 = "\([0-9a-f]\{64\}\)"$/\1/p' tools/eos.py)
          if [ -z "$version" ] || [ -z "$sha" ]; then
            echo "::error::tools/eos.py: VERSION or ASSET_SHA256 not found"
            exit 1
          fi
          {
            echo "version=$version"
            echo "sha=$sha"
            echo "key=eos-sdk-$version-${sha:0:16}"
          } >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/eos
          key: ${{ steps.v.outputs.key }}
          enableCrossOsArchive: true
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Download, verify, unpack
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          gh release download "eos-sdk-$VERSION" -R "$GITHUB_REPOSITORY" -p "eos-sdk-$VERSION.zip" -D "$RUNNER_TEMP"
          echo "$SHA  $RUNNER_TEMP/eos-sdk-$VERSION.zip" | sha256sum -c
          mkdir -p third_party/eos
          unzip -q "$RUNNER_TEMP/eos-sdk-$VERSION.zip" -d third_party/eos
          test "$(cat third_party/eos/VERSION)" = "$VERSION"
