# The EOS SDK (tools/eos.py) for the other workflows, as a cross-OS cache entry. The SDK is a set of per-platform
# zips on a draft release, and GitHub lists drafts only to tokens that can write to the repo. So this one small
# job holds `contents: write` and runs no repository code: it reads the pinned version and the zips' SHA-256 out
# of tools/eos.py, downloads every zip with gh, checks the hashes and caches the unpacked SDK (all platforms). Jobs that build or test (pull-request
# code) restore that cache with `contents: read` and never see a write token.
name: eos-sdk

on:
  workflow_call:
    outputs:
      cache-key:
        description: actions/cache key of third_party/eos (restore with enableCrossOsArchive)
        value: ${{ jobs.fetch.outputs.key }}

permissions:
  contents: read

jobs:
  fetch:
    name: EOS SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # read the draft release (see above); no repository code runs in this job
    outputs:
      key: ${{ steps.v.outputs.key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: tools/eos.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: v
        name: Pinned version and hashes (read, not run)
        run: |
          version=$(sed -n 's/^VERSION = "\([0-9.]*\)"$/\1/p' tools/eos.py)
          # "part sha" lines from the ASSET_SHA256 dict, one entry per line
          sed -n '/^ASSET_SHA256 = {/,/^}/s/^    "\([a-z0-9-]*\)": "\([0-9a-f]\{64\}\)",$/\1 \2/p' tools/eos.py \
            > "$RUNNER_TEMP/eos-parts.txt"
          cat "$RUNNER_TEMP/eos-parts.txt"
          if [ -z "$version" ] || [ ! -s "$RUNNER_TEMP/eos-parts.txt" ]; then
            echo "::error::tools/eos.py: VERSION or ASSET_SHA256 not found"
            exit 1
          fi
          all=$(sha256sum < "$RUNNER_TEMP/eos-parts.txt" | cut -c1-16)
          {
            echo "version=$version"
            echo "key=eos-sdk-$version-$all"
          } >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/eos
          key: ${{ steps.v.outputs.key }}
          enableCrossOsArchive: true
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Download, verify, unpack
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p third_party/eos
          while read -r part sha; do
            zip="eos-sdk-$VERSION-$part.zip"
            gh release download "eos-sdk-$VERSION" -R "$GITHUB_REPOSITORY" -p "$zip" -D "$RUNNER_TEMP"
            echo "$sha  $RUNNER_TEMP/$zip" | sha256sum -c
            unzip -o -q "$RUNNER_TEMP/$zip" -d third_party/eos
          done < "$RUNNER_TEMP/eos-parts.txt"
          test "$(cat third_party/eos/VERSION)" = "$VERSION"
