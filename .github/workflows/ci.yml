# Parallel jobs, all through the uni CLI (src/cli/SPEC.md): `lint` (fmt --check + vet for every target, Linux),
# `test` (the odin suite: unit tests and every end-to-end suite, reference runs included; then the net suite, the
# real-UDP multi-process test, and the benchmarks, both in the job summary) and `godot` (Linux x64: the godot and
# godot-bindings suites, every game under headless Godot). Together they run what `./uni verify` runs locally; the
# suites' long variants (`--long`) run only on demand.
#
# Which platforms `test` runs on depends on the event, to keep the costly runners off pull requests:
#   pull request         linux-x64, linux-arm64
#   push to main         linux-x64, linux-arm64, windows-x64
#   nightly (schedule)   macos-arm64 only, and only if main moved since the last nightly (the `nightly` job)
#   manual dispatch      all four, on any branch (`gh workflow run ci.yml --ref <branch>`)
#
# Security: every job that runs repository code has `contents: read`. The EOS SDK (a draft-release asset, which
# needs a write token to list) comes from eos-sdk.yml as a cache entry. Actions are pinned by commit, runner
# images by version (an image update can change compilers, so it is a deliberate bump), and every download by its
# SHA-256 in pins.cfg. Odin comes from .github/actions/odin; each command fetches or builds what else it needs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC
  workflow_dispatch:

# The nightly has its own group: a push to main must not cancel it.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Nightly only: run macOS if main's head differs from the last completed nightly's (whatever its result:
  # a red nightly is not retried every night, only after main moves or by a manual dispatch).
  nightly:
    name: nightly / main moved?
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" -w ci.yml -e schedule -s completed -L 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$last" = "$SHA" ]; then
            echo "main is still at $SHA (last nightly): nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved: ${last:-none} -> $SHA" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: format + vet
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/odin
      - id: keys
        run: echo "odinfmt=$(./uni ci cache-key odinfmt)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .out/odinfmt
          key: ${{ steps.keys.outputs.odinfmt }}
      - name: fmt --check
        run: ./uni fmt --check
      - name: vet (darwin_arm64, linux_amd64, linux_arm64, windows_amd64)
        run: ./uni vet

  eos-sdk:
    needs: nightly
    if: ${{ !cancelled() && (needs.nightly.result == 'skipped' || needs.nightly.outputs.run == 'true') }}
    uses: ./.github/workflows/eos-sdk.yml
    permissions:
      contents: write # only the fetch job in eos-sdk.yml, which runs no repository code

  test:
    name: test / ${{ matrix.platform }}
    needs: [nightly, eos-sdk]
    if: ${{ !cancelled() && needs.eos-sdk.result == 'success' }}
    runs-on: >-
      ${{ fromJSON('{"linux-x64": "ubuntu-24.04", "linux-arm64": "ubuntu-24.04-arm",
      "windows-x64": "windows-2025", "macos-arm64": "macos-15"}')[matrix.platform] }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Per event, see the top of this file.
        platform: >-
          ${{ fromJSON(
          github.event_name == 'pull_request' && '["linux-x64", "linux-arm64"]' ||
          github.event_name == 'push' && '["linux-x64", "linux-arm64", "windows-x64"]' ||
          github.event_name == 'schedule' && '["macos-arm64"]' ||
          '["linux-x64", "linux-arm64", "windows-x64", "macos-arm64"]') }}
    env:
      # Windows runs the cmd shim (it proves uni.cmd too); elsewhere the sh one.
      UNI: ${{ matrix.platform == 'windows-x64' && './uni.cmd' || './uni' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/odin
      # EOS SDK (headers + libraries): the bindings' layout check and the library load test in tests/eos.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/eos
          key: ${{ needs.eos-sdk.outputs.cache-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      # Box3D, built from its pin and patch: cached by `uni ci cache-key box3d` (the pins, the patch, our recipe, the
      # compiler's version). The build's own stamp is the check: a stale restore is rebuilt, never used. The sources
      # come too: the bindings test reads their internal headers.
      - id: keys
        run: echo "box3d=$($UNI ci cache-key box3d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/box3d/build
            third_party/box3d/src
            third_party/box3d/src.stamp
          key: ${{ steps.keys.outputs.box3d }}
      - name: test (the odin suite)
        run: $UNI test
      - name: test --suite net (release build; real UDP, separate processes, 5 s on the real clock)
        run: $UNI test --suite net
      - name: bench (release build; reported in the summary, not gated)
        run: $UNI bench
      - name: Summary
        if: always()
        run: $UNI ci summary >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-${{ matrix.platform }}
          path: |
            .out/net.json
            .out/bench.json
            .out/timings.json
            .out/net/
          if-no-files-found: ignore
          retention-days: 14

  godot:
    name: godot headless / linux-x64
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/odin
      - id: keys
        run: |
          echo "godot=$(./uni ci cache-key godot)" >> "$GITHUB_OUTPUT"
          echo "box3d=$(./uni ci cache-key box3d)" >> "$GITHUB_OUTPUT"
          echo "imgui=$(./uni ci cache-key imgui)" >> "$GITHUB_OUTPUT"
      # The official editor, hash-checked against pins.cfg when downloaded, in .out/godot/<version>/.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .out/godot
          key: ${{ steps.keys.outputs.godot }}
      # Box3D and Dear ImGui builds, as in the test job (each build's stamp is the check).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/box3d/build
            third_party/box3d/src
            third_party/box3d/src.stamp
          key: ${{ steps.keys.outputs.box3d }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/imgui/build
          key: ${{ steps.keys.outputs.imgui }}
      - name: test --suite godot,godot-bindings (every game under headless Godot, in parallel; the binding tests)
        run: ./uni test --suite godot,godot-bindings
