# One job per platform plus one for Godot, every step one uni command (src/cli/README.md): together what `./uni verify`
# runs locally, and `uni bench` (not gated). A check runs even when an earlier one failed, and each reported step's
# own output goes into the job summary. What runs where and why, and that macOS never gates a merge: AGENTS.md,
# Workflow.
#
# Platforms per event:
#   pull request                 linux-x64, linux-arm64, windows-x64, godot
#   push to main                 the four above and macos-arm64; a newer push cancels a run still going, so what is
#                                checked is the head of main, plus the nightly (AGENTS.md, Workflow)
#   nightly (schedule)           macos-arm64, only if main moved since the last nightly (the `nightly` job): the
#                                safety net when a push's macOS job was cancelled or never got a runner
#   manual dispatch              all on main; elsewhere the four above, plus macos-arm64 with `-f macos=true`
#                                (to re-check something on demand, never routine)
#   release tag (release.yml)    all: release.yml calls this workflow as the check of a library release (a tag push
#                                is a push); its manual runs pass `macos` through
#
# Security: jobs read only (`contents: read`; the nightly check also `actions: read`) and CI holds no secrets:
# no EOS SDK and no EOS credentials (Epic's licence keeps the SDK out; its tests run where a developer has it).
# Actions are pinned by commit (the repo requires it, and allows GitHub-owned actions only), runner images by version
# (an image update can change compilers, so it is a deliberate bump), and every download by its SHA-256 in pins.cfg.
# Odin comes through the uni shim, as on a fresh clone: the pinned release, checked and kept in the per-user cache,
# which is cached with everything else the pins name (one key: pins.cfg). When that cache misses (pins.cfg changed,
# or the cache expired), the job's first step is a fresh clone's real download, which is how CI proves the shims'
# download. Each command fetches or builds what else it needs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC
  workflow_dispatch:
    inputs:
      macos:
        description: "Also test macos-arm64 (always on for main)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      macos:
        description: "Also test macos-arm64 (a tag push tests it anyway)"
        type: boolean
        default: false

# One group per PR and per ref, cancelled by a newer push: on main that checks the head of main, not every push (the
# policy, AGENTS.md). The nightly has its own group: a push to main must not cancel it. A call from release.yml
# (github.workflow is the caller's) has its own too: it neither cancels nor waits for CI on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Nightly only: run macOS if main's head differs from the last completed nightly's (whatever its result:
  # a red nightly is not retried every night, only after main moves or by a manual dispatch).
  nightly:
    name: nightly / main moved?
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" -w ci.yml -e schedule -s completed -L 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$last" = "$SHA" ]; then
            echo "main is still at $SHA (last nightly): nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved: ${last:-none} -> $SHA" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: ${{ matrix.platform }}
    needs: nightly
    if: ${{ !cancelled() && (needs.nightly.result == 'skipped' || needs.nightly.outputs.run == 'true') }}
    runs-on: >-
      ${{ fromJSON('{"linux-x64": "ubuntu-24.04", "linux-arm64": "ubuntu-24.04-arm",
      "windows-x64": "windows-2025", "macos-arm64": "macos-15"}')[matrix.platform] }}
    # stops a hung run; room for a cache miss (a pins.cfg change), which downloads and builds everything once
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Per event, see the top of this file.
        platform: >-
          ${{ fromJSON(
          github.event_name == 'schedule' && '["macos-arm64"]' ||
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.macos)) &&
          '["linux-x64", "linux-arm64", "windows-x64", "macos-arm64"]' ||
          '["linux-x64", "linux-arm64", "windows-x64"]') }}
    env:
      # Windows runs the cmd shim (it proves uni.cmd too); elsewhere the sh one.
      UNI: ${{ matrix.platform == 'windows-x64' && './uni.cmd' || './uni' }}
      LINUX_X64: ${{ matrix.platform == 'linux-x64' }}
      # The odin suite against Box3D's debug library, on the runner with the most room (it reuses the odin suite's
      # binary).
      SUITES: ${{ matrix.platform == 'linux-arm64' && 'odin,box3d-debug,net' || 'odin,net' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The per-user cache (`uni`: ~/.cache/unified; `uni.cmd`: %LOCALAPPDATA%\unified): the shims' Odin. Keyed by
      # pins.cfg: the key must exist before Odin does.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/unified/odin
            ~/AppData/Local/unified/odin
          key: uni-${{ matrix.platform }}-${{ hashFiles('pins.cfg') }}
      # odinfmt, built once per pin into the per-user cache: only linux-x64 formats.
      - if: ${{ env.LINUX_X64 == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/unified/odinfmt
          key: odinfmt-${{ hashFiles('pins.cfg') }}
      # The shim fetches Odin if needed and builds the CLI; every later step relies on it.
      - id: ready
        name: uni version (the pinned Odin, the CLI)
        run: $UNI version
      - name: fmt --check
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && env.LINUX_X64 == 'true' }}
        run: ./uni fmt --check
      - name: vet (darwin_arm64, linux_amd64, linux_arm64, windows_amd64)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && env.LINUX_X64 == 'true' }}
        run: ./uni vet
      # unified-box3d (the pinned release) and the Godot bindings come on the way, every run: nothing to cache.
      - name: test --suite ${{ env.SUITES }} (net beside the others; release build, real UDP, 5 s on the real clock)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: $UNI test --suite "$SUITES" 2>&1 | tee .out/test.txt
      - name: bench (release build; reported in the summary, not gated)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: $UNI bench 2>&1 | tee .out/bench.txt
      - name: Summary
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          for step in test bench; do
            if [ -f ".out/$step.txt" ]; then printf '### %s\n```\n%s\n```\n' "$step" "$(cat ".out/$step.txt")"; fi
          done >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ matrix.platform }}
          path: |
            .out/bench.json
            .out/net/
          if-no-files-found: ignore
          retention-days: 14

  # Every game under headless Godot, the Godot bindings' tests and the view sync's benchmark, apart from the
  # platform jobs (its Godot launches are most of a run's time).
  godot:
    needs: nightly
    if: ${{ !cancelled() && needs.nightly.result == 'skipped' }}
    runs-on: ubuntu-24.04
    # stops a hung run; room for a cache miss, which downloads Godot and imports every game afresh
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/unified/odin
            ~/.cache/unified/godot
          key: uni-godot-${{ hashFiles('pins.cfg') }}
      - id: ready
        name: uni version (the pinned Odin, the CLI)
        run: ./uni version
      - name: test --suite godot,godot-bindings (every game under headless Godot, in parallel; the binding tests)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: ./uni test --suite godot,godot-bindings 2>&1 | tee .out/test.txt
      - name: view-bench (the Godot host's view sync, headless; reported in the summary, not gated)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: ./uni view-bench 2>&1 | tee .out/view-bench.txt
      - name: Summary
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          for step in test view-bench; do
            if [ -f ".out/$step.txt" ]; then printf '### %s\n```\n%s\n```\n' "$step" "$(cat ".out/$step.txt")"; fi
          done >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-godot
          path: .out/view_bench.json
          if-no-files-found: ignore
          retention-days: 14
