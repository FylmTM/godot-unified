# Minimal CI while we save Actions minutes: one job on linux-arm64, on pushes to main (and by hand,
# `gh workflow run ci.yml --ref <branch>`), never on pull requests. It runs fmt --check, vet for every target, the odin
# suite and the net suite through the uni CLI (src/cli/SPEC.md). Not run here, until CI is rebuilt: the other
# platforms (linux-x64, windows-x64, macos-arm64), the benchmarks and the godot suites; run them locally
# (`./uni verify`).
#
# Security: the job reads only (`contents: read`) and CI holds no secrets: no EOS SDK and no EOS credentials (Epic's
# licence keeps the SDK out; its tests run where a developer has it). Actions are pinned by commit, runner images by
# version (an image update can change compilers, so it is a deliberate bump), and every download by its SHA-256 in
# pins.cfg. Odin comes from .github/actions/odin; each command fetches or builds what else it needs.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: format + vet + test / linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/odin
      - id: keys
        run: echo "odinfmt=$(./uni ci cache-key odinfmt)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .out/odinfmt
          key: ${{ steps.keys.outputs.odinfmt }}
      - name: fmt --check
        run: ./uni fmt --check
      - name: vet (darwin_arm64, linux_amd64, linux_arm64, windows_amd64)
        run: ./uni vet
      - name: test (the odin suite)
        run: ./uni test
      - name: test --suite net (release build; real UDP, separate processes, 5 s on the real clock)
        run: ./uni test --suite net
      - name: Summary
        if: always()
        run: ./uni ci summary >> "$GITHUB_STEP_SUMMARY"
