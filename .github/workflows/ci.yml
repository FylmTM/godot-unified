# Parallel jobs: `lint` (format check + vet for every target, Linux), `test` (odin test: unit tests and every
# end-to-end suite, reference runs included; then `dev.py check`: the real-UDP multi-process test, and the rollback
# bench in the job summary), and `godot` (Linux x64: `dev.py godot-checks`, the binding tests and every game's
# headless Godot checks, GDScript included). Together they run what
# `python tools/dev.py all` runs locally.
#
# Which platforms `test` runs on depends on the event, to keep the costly runners off pull requests:
#   pull request         linux-x64, linux-arm64
#   push to main         linux-x64, linux-arm64, windows-x64
#   nightly (schedule)   macos-arm64 only, and only if main moved since the last nightly (the `nightly` job)
#   manual dispatch      all four, on any branch (`gh workflow run ci.yml --ref <branch>`)
#
# Security: every job that runs repository code has `contents: read`. The EOS SDK (a draft-release asset, which
# needs a write token to list) comes from eos-sdk.yml as a cache entry. Actions are pinned by commit, runner
# images by version (an image update can change compilers, so it is a deliberate bump), downloads by SHA-256
# (tools/ci.py, tools/common.py), and the Box3D cache key includes the compiler version.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC
  workflow_dispatch:

# The nightly has its own group: a push to main must not cancel it.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ODIN_TAG: dev-2026-11
  PYTHONUNBUFFERED: "1"

jobs:
  # Nightly only: run macOS if main's head differs from the last completed nightly's (whatever its result:
  # a red nightly is not retried every night, only after main moves or by a manual dispatch).
  nightly:
    name: nightly / main moved?
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" -w ci.yml -e schedule -s completed -L 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$last" = "$SHA" ]; then
            echo "main is still at $SHA (last nightly): nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved: ${last:-none} -> $SHA" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: format + vet
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .toolchains
          key: toolchains-linux-x64-${{ env.ODIN_TAG }}-${{ hashFiles('tools/ci.py') }}
      # `ci.py odin` adds Odin to $GITHUB_PATH, which takes effect from the next step on.
      - name: Odin
        run: python3 tools/ci.py odin ${{ env.ODIN_TAG }} .toolchains/odin
      - name: odinfmt
        run: |
          odin version
          python3 tools/ci.py odinfmt .toolchains/odinfmt

      - name: fmt --check
        run: python3 tools/dev.py fmt --check
      - name: vet (darwin_arm64, darwin_amd64, linux_amd64, linux_arm64, windows_amd64)
        run: python3 tools/dev.py vet

  eos-sdk:
    needs: nightly
    if: ${{ !cancelled() && (needs.nightly.result == 'skipped' || needs.nightly.outputs.run == 'true') }}
    uses: ./.github/workflows/eos-sdk.yml
    permissions:
      contents: write # only the fetch job in eos-sdk.yml, which runs no repository code

  test:
    name: test / ${{ matrix.platform }}
    needs: [nightly, eos-sdk]
    if: ${{ !cancelled() && needs.eos-sdk.result == 'success' }}
    runs-on: >-
      ${{ fromJSON('{"linux-x64": "ubuntu-24.04", "linux-arm64": "ubuntu-24.04-arm",
      "windows-x64": "windows-2025", "macos-arm64": "macos-15"}')[matrix.platform] }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Per event, see the top of this file.
        platform: >-
          ${{ fromJSON(
          github.event_name == 'pull_request' && '["linux-x64", "linux-arm64"]' ||
          github.event_name == 'push' && '["linux-x64", "linux-arm64", "windows-x64"]' ||
          github.event_name == 'schedule' && '["macos-arm64"]' ||
          '["linux-x64", "linux-arm64", "windows-x64", "macos-arm64"]') }}
    env:
      PY: ${{ matrix.platform == 'windows-x64' && 'python' || 'python3' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .toolchains/odin
          key: odin-${{ env.ODIN_TAG }}-${{ matrix.platform }}
      # `ci.py odin` adds Odin to $GITHUB_PATH, which takes effect from the next step on.
      - name: Odin
        run: $PY tools/ci.py odin ${{ env.ODIN_TAG }} .toolchains/odin

      # Box3D: rebuilt only when the pinned commit, the fork patch, the recipe or the compiler change. Building it
      # needs CMake + Ninja (and clang-cl with the MSVC environment on Windows, which box3d.py loads itself).
      - id: cc
        run: echo "id=$($PY tools/ci.py compiler-id)" >> "$GITHUB_OUTPUT"
      - id: box3d-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/box3d/build/${{ matrix.platform }}
          key: box3d-${{ matrix.platform }}-${{ steps.cc.outputs.id }}-${{ hashFiles('third_party/box3d.patch', 'tools/box3d.py', 'tools/common.py') }}
      - if: steps.box3d-cache.outputs.cache-hit != 'true'
        run: $PY tools/ci.py ensure-ninja
      - name: Box3D
        run: |
          odin version
          $PY tools/box3d.py

      # EOS SDK (headers + libraries): the bindings' layout check and the library load test in tests/eos.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/eos
          key: ${{ needs.eos-sdk.outputs.cache-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: EOS SDK
        run: $PY tools/eos.py

      - name: odin test
        run: $PY tools/dev.py test
      - name: check (release build; real-UDP multi-process test, rollback bench)
        run: $PY tools/dev.py check

      - name: Summary
        if: always()
        run: $PY tools/ci.py summary >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: check-${{ matrix.platform }}
          path: |
            out/check.json
            out/timings.json
            out/check/
          if-no-files-found: ignore
          retention-days: 14

  godot:
    name: godot headless / linux-x64
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .toolchains/odin
          key: odin-${{ env.ODIN_TAG }}-linux-x64
      - name: Odin
        run: python3 tools/ci.py odin ${{ env.ODIN_TAG }} .toolchains/odin

      - id: cc
        run: echo "id=$(python3 tools/ci.py compiler-id)" >> "$GITHUB_OUTPUT"
      - id: box3d-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/box3d/build/linux-x64
          key: box3d-linux-x64-${{ steps.cc.outputs.id }}-${{ hashFiles('third_party/box3d.patch', 'tools/box3d.py', 'tools/common.py') }}
      - if: steps.box3d-cache.outputs.cache-hit != 'true'
        run: python3 tools/ci.py ensure-ninja
      - name: Box3D
        run: python3 tools/box3d.py

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/imgui/build/linux-x64
          key: imgui-linux-x64-${{ steps.cc.outputs.id }}-${{ hashFiles('tools/imgui.py') }}
      - name: Dear ImGui
        run: python3 tools/imgui.py

      # The official editor, hash-checked (tools/common.py GODOT_EDITORS), in .toolchains/godot/<version>/.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .toolchains/godot
          key: godot-${{ hashFiles('tools/common.py') }}-linux-x64
      - name: Godot (standard build)
        run: python3 tools/ci.py godot

      - name: godot-checks (binding tests; per game headless, session, editor, validate, walk)
        run: python3 tools/dev.py godot-checks
