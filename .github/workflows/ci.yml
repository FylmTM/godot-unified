# Odin only. Three parallel jobs: `lint` (format check + vet for every target, Linux) and `test` on Linux x64
# and Windows x64 (odin test, then T1-T9 of spec/CORE.md §4 with the T9 bench in the job summary).
# macOS is checked locally with the same commands (README.md). Toolchains and Box3D are cached.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ODIN_TAG: dev-2026-11
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: format + vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .toolchains
          key: toolchains-linux-x64-${{ env.ODIN_TAG }}-${{ hashFiles('tools/ci.py') }}
      - name: Odin + odinfmt
        run: |
          python3 tools/ci.py odin ${{ env.ODIN_TAG }} .toolchains/odin
          export PATH="$(dirname "$(find .toolchains/odin -maxdepth 3 -type f -name odin | head -1)"):$PATH"
          python3 tools/ci.py odinfmt .toolchains/odinfmt
          odin version

      - name: fmt --check
        run: python3 tools/dev.py fmt --check
      - name: vet (darwin_arm64, darwin_amd64, linux_amd64, windows_amd64)
        run: python3 tools/dev.py vet

  test:
    name: test / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            py: python3
          - os: windows-latest
            platform: windows-x64
            py: python
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .toolchains/odin
          key: odin-${{ env.ODIN_TAG }}-${{ matrix.platform }}
      - name: Odin
        run: |
          ${{ matrix.py }} tools/ci.py odin ${{ env.ODIN_TAG }} .toolchains/odin
          odin version

      # Box3D: rebuilt only when the pinned commit, the fork patch or the recipe change. Building it needs
      # CMake + Ninja (and clang-cl with the MSVC environment on Windows, which box3d.py loads itself).
      - id: box3d-cache
        uses: actions/cache@v4
        with:
          path: third_party/box3d/build/${{ matrix.platform }}
          key: box3d-${{ matrix.platform }}-${{ hashFiles('third_party/box3d.patch', 'tools/box3d.py', 'tools/common.py') }}
      - if: steps.box3d-cache.outputs.cache-hit != 'true'
        run: ${{ matrix.py }} tools/ci.py ensure-ninja
      - name: Box3D
        run: ${{ matrix.py }} tools/box3d.py

      - name: odin test
        run: ${{ matrix.py }} tools/dev.py test
      - name: T1-T9 (release build + check.py)
        run: ${{ matrix.py }} tools/dev.py check

      - name: Summary
        if: always()
        run: ${{ matrix.py }} tools/ci.py summary >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.platform }}
          path: |
            out/check.json
            out/timings.json
            out/check/
          if-no-files-found: ignore
          retention-days: 14
