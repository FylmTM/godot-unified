# TEMPORARY (#49): proves on a macOS runner that a window uni opens in the background never keeps the keyboard.
# Removed before the PR is merged.
name: focus-experiment

on:
  push:
    branches: [claude/no-focus-windows-2d6c48]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/unified/odin
          key: odin-macos-arm64-${{ hashFiles('pins.cfg') }}
      - run: ./uni version
      - name: Fetch Godot, build the games (headless; not measured)
        run: |
          ./uni build drift
          ./uni build survivor
          ./uni build friendslop
          ./uni test drift --suite godot --only validate
      - name: Why a window that isn't frontmost stalls
        run: |
          set +e
          system_profiler SPDisplaysDataType | grep -i -E "resolution|display type|ui looks" || true
          F="$RUNNER_TEMP/focus"; mkdir -p "$F"
          GODOT=$(find ~/.cache/unified/godot -path '*Godot.app/Contents/MacOS/Godot' | head -1)
          now() { perl -MTime::HiRes=time -e 'printf "%.3f", time'; }
          front_name() { lsappinfo info -only name "$(lsappinfo front)" | sed 's/.*=//; s/"//g'; }
          # A guard in bash: TextEdit back in front whenever Godot comes in front, until $F/stop.
          bash_guard() {
            while [ ! -f "$F/stop" ]; do
              case "$(front_name)" in *odot*) open -b com.apple.TextEdit ;; esac
              sleep 0.025
            done
          }
          variant() {
            label=$1; override=$2; guard=$3; hide=$4; game=$5; script=$6; shift 6
            open -a TextEdit; sleep 2; osascript -e 'tell application "TextEdit" to activate'; sleep 1
            if [ "$hide" = hide ]; then osascript -e 'tell application "TextEdit" to set miniaturized of every window to true'; sleep 1; fi
            rm -f games/*/override.cfg
            [ -n "$override" ] && printf '[display]\n\n%b\n' "$override" > games/$game/override.cfg
            rm -f "$F/stop"
            [ "$guard" = guard ] && { bash_guard & g=$!; }
            start=$(now)
            "$GODOT" --resolution 1280x720 --audio-driver Dummy --path games/$game -s res://game/tools/$script.gd -- --no-settings --local-net "$@" > "$F/$label.out" 2>&1
            code=$?
            touch "$F/stop"; [ "$guard" = guard ] && wait $g
            fences=$(grep -c "timeout waiting for fence" "$F/$label.out")
            res=$(grep -E "steps, (ok|FAILED)" "$F/$label.out" | tail -1)
            printf "RESULT %-40s exit %d, %5.1f s, fence timeouts %s, front at the end %s: %s\n" "$label" $code "$(perl -e "print $(now) - $start")" "$fences" "$(front_name)" "$res" | tee -a "$F/results.txt"
            echo "::group::$label output"; grep -v "marker view" "$F/$label.out" | tail -40; echo "::endgroup::"
            rm -f games/$game/override.cfg
          }
          for run in drift:tour survivor:ui_walk; do
            game=${run%%:*}; script=${run##*:}; extra=""; [ $script = ui_walk ] && extra=--mock
            variant "$game-$script control-in-front"            ""                                             none show $game $script $extra
            variant "$game-$script no_focus+guard"               "window/size/no_focus=true"                    guard show $game $script $extra
            variant "$game-$script no_focus+on_top+guard"        "window/size/no_focus=true\nwindow/size/always_on_top=true" guard show $game $script $extra
          done
          echo; cat "$F/results.txt" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focus-macos
          path: |
            games/*/.out/shots/
          if-no-files-found: ignore
          retention-days: 7
