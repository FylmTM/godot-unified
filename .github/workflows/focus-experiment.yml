# TEMPORARY (#49): proves on a macOS runner that a window uni opens in the background never keeps the keyboard.
# Removed before the PR is merged.
name: focus-experiment

on:
  push:
    branches: [claude/no-focus-windows-2d6c48]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/unified/odin
          key: odin-macos-arm64-${{ hashFiles('pins.cfg') }}
      - run: ./uni version
      - name: Fetch Godot, build the games (headless; not measured)
        run: |
          ./uni build drift
          ./uni build survivor
          ./uni build friendslop
          ./uni test drift --suite godot --only validate
      - name: The focus checks
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/focus"
          F="$RUNNER_TEMP/focus"
          GODOT=$(find ~/.cache/unified/godot -path '*Godot.app/Contents/MacOS/Godot' | head -1)
          echo "godot: $GODOT"
          now() { perl -MTime::HiRes=time -e 'printf "%.3f", time'; }
          # Every change of the front app, with a timestamp, until $F/stop exists.
          watch_front() {
            prev=""
            while [ ! -f "$F/stop" ]; do
              asn=$(lsappinfo front)
              if [ "$asn" != "$prev" ]; then
                echo "$(now) $(lsappinfo info -only name "$asn" | sed 's/.*=//; s/"//g') $asn"
                prev=$asn
              fi
            done
          }
          front_name() { lsappinfo info -only name "$(lsappinfo front)" | sed 's/.*=//; s/"//g'; }
          # Runs one check with TextEdit in front; prints how long a Godot held the front.
          check() {
            label=$1; shift
            open -a TextEdit; sleep 3
            osascript -e 'tell application "TextEdit" to activate' || true; sleep 1
            echo "::group::$label (front before: $(front_name))"
            rm -f "$F/stop"
            watch_front > "$F/$label.log" &
            watcher=$!
            sleep 0.5
            start=$(now)
            "$@"; code=$?
            end=$(now)
            touch "$F/stop"; wait $watcher
            echo "::endgroup::"
            cat "$F/$label.log"
            perl -e '
              my ($label, $code, $start, $end) = @ARGV; my @rows;
              open my $fh, "<", "'"$F"'/$label.log"; while (<$fh>) { my ($t, $name) = split / /; push @rows, [$t, $name]; }
              my ($total, $max, $times) = (0, 0, 0);
              for my $i (0..$#rows) {
                my $until = $i < $#rows ? $rows[$i+1][0] : $end;
                if ($rows[$i][1] =~ /godot/i) { my $d = $until - $rows[$i][0]; $total += $d; $max = $d if $d > $max; $times++; }
              }
              printf "RESULT %-28s exit %d, %.1f s, Godot in front %d time(s), %.3f s in all, longest %.3f s, front at the end: %s\n",
                $label, $code, $end - $start, $times, $total, $max, $rows[-1][1];
            ' "$label" "$code" "$start" "$end" | tee -a "$F/results.txt"
          }
          # Baseline: Godot with the no-focus override and no guard (what the flag alone does on macOS).
          printf '[display]\n\nwindow/size/no_focus=true\n' > games/drift/override.cfg
          check baseline-no-guard "$GODOT" --audio-driver Dummy --resolution 640x360 --path games/drift --quit-after 600
          rm -f games/drift/override.cfg
          check tool-drift-tour ./uni --verbose tool drift tour --window --mute --shots
          check tool-friendslop-tour ./uni --verbose tool friendslop tour --window --mute
          check tool-survivor-ui_walk ./uni --verbose tool survivor ui_walk --window --mute --shots -- --mock
          check tool-survivor-play_check ./uni --verbose tool survivor play_check --window --mute
          check coop-drift-lan ./uni --verbose coop drift --window --mute --lan
          check run-drift-background bash -c '(sleep 20; pkill -f "Godot.app/Contents/MacOS/Godot") & ./uni --verbose run drift --mute --background; echo "run ended"; test ! -f games/drift/override.cfg'
          echo; cat "$F/results.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          ls games/*/override.cfg 2>/dev/null && echo "override.cfg left behind" || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focus-macos
          path: |
            games/*/.out/shots/
          if-no-files-found: ignore
          retention-days: 7
