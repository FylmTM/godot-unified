[workspace]
resolver = "3"
members = ["crates/box3d-sys", "crates/simcore", "crates/netcode", "crates/game", "crates/unified"]
default-members = ["crates/unified"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"
publish = false

[workspace.dependencies]
box3d-sys = { path = "crates/box3d-sys" }
simcore = { path = "crates/simcore" }
netcode = { path = "crates/netcode" }
game = { path = "crates/game" }
bytemuck = { version = "1.25", features = ["derive", "min_const_generics", "extern_crate_alloc"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# dev: the inner loop. Own crates at opt-level 1 (still quick to compile, but a 1000-enemy sim and the
# rollback sessions stay usable), dependencies at 3 (compiled once). Overflow checks stay on in dev.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
codegen-units = 4
incremental = false
